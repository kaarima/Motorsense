[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motorsense-ml"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["ml/src"]

[tool.ruff]
line-length = 100
src = ["ml/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
pythonpath = ["ml/src"]
